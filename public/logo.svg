<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Hexagon background -->
  <path d="M100 10 L170 50 L170 130 L100 170 L30 130 L30 50 Z" fill="url(#bg)" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Inner hexagon ring -->
  <path d="M100 30 L150 60 L150 120 L100 150 L50 120 L50 60 Z" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Graduation cap / circuit symbol -->
  <g transform="translate(100, 85)" filter="url(#glow)">
    <!-- Cap top -->
    <path d="M-25 10 L0 -5 L25 10 L0 25 Z" fill="url(#cap)" opacity="0.95"/>
    <!-- Cap base -->
    <rect x="-18" y="25" width="36" height="4" rx="2" fill="url(#cap)" opacity="0.9"/>
    <!-- Tassel -->
    <line x1="0" y1="-5" x2="0" y2="-18" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="3.5" fill="#f59e0b"/>
    <!-- Brain/circuit nodes on cap -->
    <circle cx="-12" cy="8" r="2.5" fill="#3b82f6"/>
    <circle cx="12" cy="8" r="2.5" fill="#06b6d4"/>
    <circle cx="0" cy="15" r="2.5" fill="#8b5cf6"/>
    <!-- Connection lines -->
    <line x1="-12" y1="8" x2="0" y2="15" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
    <line x1="12" y1="8" x2="0" y2="15" stroke="rgba(255,255,255,0.5)" stroke-width="1"/>
  </g>

  <!-- CampusIQ text -->
  <text x="100" y="145" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="22" font-weight="700" fill="url(#bg)" letter-spacing="2">CampusIQ</text>
  <text x="100" y="162" text-anchor="middle" font-family="Exo 2, sans-serif" font-size="9" font-weight="500" fill="rgba(255,255,255,0.6)" letter-spacing="3">KsTU</text>
</svg>
