<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="50%" style="stop-color:#06b6d4"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="capGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e0f2fe"/>
    </linearGradient>
    <linearGradient id="aiGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#facc15"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="aiGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer hexagon background -->
  <path d="M160 20 L255 75 L255 145 L160 200 L65 145 L65 75 Z" fill="url(#hexGradient)" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>

  <!-- Inner hexagon ring -->
  <path d="M160 40 L220 75 L220 125 L160 150 L100 125 L100 75 Z" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>

  <!-- Circuit traces radiating from center -->
  <g stroke="rgba(59,130,246,0.3)" stroke-width="1">
    <line x1="160" y1="150" x2="160" y2="180"/>
    <line x1="100" y1="125" x2="85" y2="140"/>
    <line x1="220" y1="125" x2="235" y2="140"/>
    <line x1="160" y1="40" x2="160" y2="25"/>
  </g>

  <!-- Circuit connection nodes -->
  <circle cx="160" cy="180" r="3" fill="#06b6d4"/>
  <circle cx="85" cy="140" r="3" fill="#3b82f6"/>
  <circle cx="235" cy="140" r="3" fill="#8b5cf6"/>
  <circle cx="160" cy="25" r="3" fill="#f59e0b"/>

  <!-- Graduation cap + AI circuit/tassel (centered in hexagon) -->
  <g transform="translate(160, 95)" filter="url(#glow)">
    <!-- Cap top -->
    <path d="M-32 5 L0 -12 L32 5 L0 22 Z" fill="url(#capGradient)" opacity="0.95"/>
    <!-- Cap base -->
    <rect x="-22" y="22" width="44" height="5" rx="2.5" fill="url(#capGradient)" opacity="0.85"/>
    <!-- AI Brain nodes on cap -->
    <circle cx="-16" cy="8" r="3.5" fill="#3b82f6" filter="url(#aiGlow)"/>
    <circle cx="16" cy="8" r="3.5" fill="#06b6d4" filter="url(#aiGlow)"/>
    <circle cx="0" cy="18" r="3.5" fill="#8b5cf6" filter="url(#aiGlow)"/>
    <!-- Connection lines between AI nodes -->
    <line x1="-16" y1="8" x2="0" y2="18" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
    <line x1="16" y1="8" x2="0" y2="18" stroke="rgba(255,255,255,0.5)" stroke-width="1.2"/>
    <!-- AI-powered tassel (replaces traditional tassel) -->
    <line x1="0" y1="-12" x2="0" y2="-30" stroke="url(#aiGradient)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-32" r="5" fill="url(#aiGradient)" filter="url(#aiGlow)"/>
    <!-- Neural network pattern on tassel -->
    <circle cx="-4" cy="-22" r="1.5" fill="#ffffff"/>
    <circle cx="4" cy="-22" r="1.5" fill="#ffffff"/>
    <circle cx="-4" cy="-26" r="1.5" fill="#ffffff"/>
    <circle cx="4" cy="-26" r="1.5" fill="#ffffff"/>
  </g>

  <!-- CampusIQ text -->
  <text x="160" y="172" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="28" font-weight="700" fill="url(#hexGradient)" letter-spacing="3">CampusIQ</text>
  <text x="160" y="188" text-anchor="middle" font-family="Exo 2, sans-serif" font-size="12" font-weight="500" fill="rgba(255,255,255,0.7)" letter-spacing="4">KsTU</text>
</svg>
